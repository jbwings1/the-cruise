<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Regan N Elaina's Wedding Cruise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="hub">
      <div class="hub-scrim" aria-hidden="true"></div>

      <header class="hub-banner">
        <svg
          class="hub-arc"
          viewBox="0 0 1000 180"
          role="img"
          aria-label="Regan N Elaina's Wedding Cruise"
        >
          <defs>
            <path id="title-arc" d="M 60 145 Q 500 20 940 145" fill="none" />
          </defs>
          <text class="hub-arc-text">
            <textPath href="#title-arc" startOffset="50%" text-anchor="middle">
              Regan N Elaina's Wedding Cruise
            </textPath>
          </text>
        </svg>
        <p class="hub-sub">Symphony of the Seas · September 19 – 25, 2027</p>
      </header>

      <div class="hub-links-wrap">
        <nav class="hub-links hub-links-left" aria-label="Cruise pages left">
          <a class="hub-link" href="important-task.html">
            <img class="hub-link-logo" src="images/anchor.svg" alt="" />
            <span>Important Task</span>
          </a>
          <a class="hub-link" href="agent.html">
            <img class="hub-link-logo" src="images/anchor.svg" alt="" />
            <span>Travel Agent</span>
          </a>
          <a class="hub-link" href="ship-map.html">
            <img class="hub-link-logo" src="images/anchor.svg" alt="" />
            <span>Ship Map</span>
          </a>
        </nav>
        <nav class="hub-links hub-links-right" aria-label="Cruise pages right">
          <a class="hub-link" href="faq.html">
            <img class="hub-link-logo" src="images/anchor.svg" alt="" />
            <span>FAQ</span>
          </a>
          <a class="hub-link" href="whos-coming.html">
            <img class="hub-link-logo" src="images/anchor.svg" alt="" />
            <span>Who's Coming</span>
          </a>
          <a class="hub-link" id="chat-link" href="chat.html">
            <img class="hub-link-logo" src="images/anchor.svg" alt="" />
            <span>Cruise Chat</span>
            <span id="chat-new-badge" class="hub-link-badge" hidden></span>
          </a>
        </nav>
      </div>

      <p class="hub-footer">
        This page is to help you get set up for the Cruise and celebrate with
        them. Follow the links to get your questions answered.
      </p>

      <div
        id="cruise-countdown"
        class="hub-countdown"
        data-sail="2027-09-19T16:00:00-04:00"
        aria-live="polite"
      >
        <p class="hub-countdown-label">Countdown to sail day</p>
        <div class="hub-countdown-grid">
          <div class="hub-countdown-unit">
            <span data-unit="days">0</span>
            <small>Days</small>
          </div>
          <div class="hub-countdown-unit">
            <span data-unit="hours">0</span>
            <small>Hours</small>
          </div>
          <div class="hub-countdown-unit">
            <span data-unit="minutes">0</span>
            <small>Minutes</small>
          </div>
          <div class="hub-countdown-unit">
            <span data-unit="seconds">0</span>
            <small>Seconds</small>
          </div>
        </div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="hub-chat-badge.js"></script>
    <script src="countdown.js"></script>
  </body>
</html>
