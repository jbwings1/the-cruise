<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cruise Chat · Regan N Elaina's Wedding Cruise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="page-chat">
    <div class="chat-shell">
      <header class="chat-header">
        <a class="chat-back" href="index.html">← Main page</a>
        <div class="chat-heading">
          <h1>Cruise Chat</h1>
          <p>Ask questions or plan together. Pick a display name and jump in.</p>
        </div>
      </header>

      <section class="chat-panel" aria-label="Group chat">
        <div id="chat-status" class="chat-status" role="status">Connecting…</div>

        <div class="tips-block">
          <h2>Tips</h2>
          <p class="tips-help">
            Helpful info pinned by hosts. Enter your name below to thumbs-up a tip.
          </p>
          <div id="tips-log" class="tips-log" aria-live="polite"></div>
        </div>

        <h2 class="chat-log-title">Chat</h2>
        <div id="chat-log" class="chat-log" aria-live="polite"></div>

        <form id="chat-form" class="chat-form">
          <label class="chat-field chat-name-field">
            <span>Display name</span>
            <input
              id="display-name"
              name="displayName"
              type="text"
              maxlength="40"
              autocomplete="nickname"
              placeholder="Your name"
              required
            />
          </label>
          <label class="chat-field chat-message-field">
            <span class="visually-hidden">Message</span>
            <textarea
              id="message-body"
              name="body"
              rows="2"
              maxlength="1000"
              placeholder="Say hello, ask a question, or share a plan…"
              required
            ></textarea>
          </label>
          <button type="submit" class="chat-send">Send</button>
        </form>
      </section>

      <section id="admin-panel" class="admin-panel" hidden>
        <div id="admin-lock" class="admin-lock">
          <label class="chat-field">
            <span>Host PIN</span>
            <input id="admin-pin" type="password" inputmode="numeric" maxlength="12" />
          </label>
          <div class="admin-lock-actions">
            <button type="button" id="admin-cancel" class="admin-lock-btn">Cancel</button>
            <button type="button" id="admin-unlock" class="chat-send">Unlock</button>
          </div>
        </div>
        <div id="admin-tools" class="admin-tools" hidden>
          <p class="admin-unlocked">Host tools unlocked. You can pin tips and remove posts.</p>
          <label class="chat-field">
            <span>Find messages (text)</span>
            <input id="admin-search-text" type="search" placeholder="Search chat text…" />
          </label>
          <label class="chat-field">
            <span>Find by date</span>
            <input id="admin-search-date" type="date" />
          </label>
          <button type="button" id="admin-lock-btn" class="admin-lock-btn">
            Log out of host tools
          </button>
        </div>
      </section>

      <button
        type="button"
        id="host-anchor"
        class="host-anchor"
        title="Host"
        aria-label="Host access"
      >
        <img src="images/anchor.svg" alt="" />
      </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="chat.js"></script>
  </body>
</html>
