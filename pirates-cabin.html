<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Captain’s Cabin · Regan N Elaina's Wedding Cruise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Pirata+One&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="pirate-treasures.css?v=57" />
  </head>
  <body class="pirate-page cabin-page">
    <header class="cabin-hud">
      <div class="cabin-brand">
        <p class="cabin-brand-mark">Captain’s Cabin</p>
        <p class="cabin-brand-line">Regan &amp; Elaina · Treasure awaits</p>
      </div>
      <div class="cabin-hud-actions">
        <a class="cabin-play" href="walk-the-plank.html">Walk the Plank</a>
      </div>
    </header>

    <main
      class="cabin-stage"
      id="cabin-stage"
      aria-label="Captain’s cabin. Drag or use the bottom arrows to rotate."
      tabindex="0"
    >
      <div class="cabin-viewport">
        <div class="cabin-world" id="cabin-world">
          <div class="cabin-face cabin-face-stern">
            <img
              src="images/cabin-stern-wall.jpg?v=4"
              alt="Stern wall with three sunrise ocean windows"
              draggable="false"
            />
          </div>
          <div class="cabin-face cabin-face-back">
            <img
              src="images/cabin-back-wall-v7.jpg?v=1"
              alt="Back wall with arched door and ship-view portholes"
              draggable="false"
            />
            <button type="button" class="cabin-door-exit" data-href="index.html">
              Exit to cruise hub
            </button>
          </div>
          <div class="cabin-face cabin-face-port">
            <img
              src="images/cabin-port-wall-v14.jpg?v=3"
              alt="Port wall with the left stern window and frame on the left"
              draggable="false"
            />
          </div>
          <div class="cabin-face cabin-face-starboard">
            <img
              src="images/cabin-starboard-wall-v5.jpg?v=3"
              alt="Starboard wall with the right stern window and frame on the right"
              draggable="false"
            />
          </div>
          <div class="cabin-face cabin-face-floor" aria-hidden="true"></div>
          <div class="cabin-face cabin-face-ceiling" aria-hidden="true"></div>
        </div>
      </div>
    </main>

    <div class="cabin-turn" role="group" aria-label="Rotate view">
      <button
        type="button"
        class="cabin-turn-btn"
        id="cabin-turn-left"
        aria-label="Rotate left"
      >
        ‹
      </button>
      <p class="cabin-note" id="cabin-note">Standing at the door · facing the stern</p>
      <button
        type="button"
        class="cabin-turn-btn"
        id="cabin-turn-right"
        aria-label="Rotate right"
      >
        ›
      </button>
    </div>

    <script src="pirates-cabin.js?v=36"></script>
  </body>
</html>
