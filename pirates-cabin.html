<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Captain’s Cabin · Regan N Elaina's Wedding Cruise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Pirata+One&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="pirate-treasures.css?v=25" />
  </head>
  <body class="pirate-page cabin-page">
    <header class="cabin-hud">
      <div class="cabin-brand">
        <p class="cabin-brand-mark">Captain’s Cabin</p>
        <p class="cabin-brand-line">Regan &amp; Elaina · Treasure awaits</p>
      </div>
      <a class="cabin-exit" href="index.html">Exit to cruise hub</a>
    </header>

    <div
      class="cabin-look"
      id="cabin-look"
      role="region"
      aria-label="Captain’s cabin. Drag or use arrows to look around."
      tabindex="0"
    >
      <div class="cabin-world" id="cabin-world">
        <img
          class="cabin-pano"
          id="cabin-pano"
          src="images/cabin-panorama.jpg"
          alt="Painterly view of the empty captain’s cabin overlooking a sunset sea"
          draggable="false"
        />
        <a
          class="cabin-hotspot"
          id="plank-hotspot"
          href="walk-the-plank.html"
          style="left: 61.2%; top: 42%"
        >
          <span class="cabin-hotspot-ring" aria-hidden="true"></span>
          <span class="cabin-hotspot-label">Walk the Plank</span>
          <span class="cabin-hotspot-hint">Play for gems</span>
        </a>
      </div>
      <div class="cabin-vignette" aria-hidden="true"></div>
    </div>

    <button
      type="button"
      class="cabin-turn cabin-turn-left"
      id="cabin-turn-left"
      aria-label="Look left"
    >
      ‹
    </button>
    <button
      type="button"
      class="cabin-turn cabin-turn-right"
      id="cabin-turn-right"
      aria-label="Look right"
    >
      ›
    </button>

    <p class="cabin-hint" id="cabin-hint">Drag · arrows · or buttons to look around</p>

    <script src="pirates-cabin.js?v=3"></script>
  </body>
</html>
