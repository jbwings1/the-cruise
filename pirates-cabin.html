<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Captain’s Cabin · Regan N Elaina's Wedding Cruise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Pirata+One&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="pirate-treasures.css?v=36" />
  </head>
  <body class="pirate-page cabin-page">
    <header class="cabin-hud">
      <div class="cabin-brand">
        <p class="cabin-brand-mark">Captain’s Cabin</p>
        <p class="cabin-brand-line">Regan &amp; Elaina · Treasure awaits</p>
      </div>
      <a class="cabin-exit" href="index.html">Exit to cruise hub</a>
    </header>

    <div
      class="cabin-look"
      id="cabin-look"
      role="region"
      aria-label="Captain’s cabin. Drag or use arrows to look left and right."
      tabindex="0"
    >
      <div class="cabin-room" id="cabin-room">
        <div class="cabin-ceiling" aria-hidden="true"></div>
        <div class="cabin-floor" aria-hidden="true"></div>

        <div class="cabin-wall cabin-wall-left">
          <img
            src="images/cabin-wall-left.jpg?v=1"
            alt="Left cabin wall with bookshelves and a daytime porthole"
            draggable="false"
          />
        </div>

        <div class="cabin-wall cabin-wall-front">
          <img
            src="images/cabin-wall-front.jpg?v=1"
            alt="Stern desk and daytime ocean windows"
            draggable="false"
          />
        </div>

        <div class="cabin-wall cabin-wall-right">
          <img
            src="images/cabin-wall-right.jpg?v=1"
            alt="Right cabin wall with cutlass and sunset window"
            draggable="false"
          />
          <a
            class="cabin-hotspot cabin-hotspot-sword"
            id="plank-hotspot"
            href="walk-the-plank.html"
            aria-label="Walk the Plank — click the sword to play"
          >
            <span class="cabin-sword-glow" aria-hidden="true"></span>
            <span class="cabin-hotspot-copy">
              <span class="cabin-hotspot-label">Walk the Plank</span>
              <span class="cabin-hotspot-hint">Click the sword</span>
            </span>
          </a>
        </div>
      </div>
      <div class="cabin-vignette" aria-hidden="true"></div>
    </div>

    <button
      type="button"
      class="cabin-turn cabin-turn-left"
      id="cabin-turn-left"
      aria-label="Look left"
    >
      ‹
    </button>
    <button
      type="button"
      class="cabin-turn cabin-turn-right"
      id="cabin-turn-right"
      aria-label="Look right"
    >
      ›
    </button>

    <p class="cabin-hint" id="cabin-hint">Drag · arrows · or buttons to look around the cabin</p>

    <script src="pirates-cabin.js?v=7"></script>
  </body>
</html>
