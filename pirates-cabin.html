<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Captain’s Cabin · Regan N Elaina's Wedding Cruise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Pirata+One&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="pirate-treasures.css?v=86" />
  </head>
  <body class="pirate-page cabin-page">
    <header class="cabin-hud">
      <div class="cabin-brand">
        <p class="cabin-brand-mark">Captain’s Cabin</p>
        <p class="cabin-brand-line">Regan &amp; Elaina · Treasure awaits</p>
      </div>
      <div class="cabin-hud-actions">
        <button type="button" class="cabin-move-btn" id="cabin-move-desk">
          Move desk
        </button>
        <button type="button" class="cabin-move-btn" id="cabin-move-rum">
          Move rum
        </button>
      </div>
    </header>

    <main
      class="cabin-stage"
      id="cabin-stage"
      aria-label="Captain’s cabin. Drag or use the bottom arrows to rotate."
      tabindex="0"
    >
      <div class="cabin-viewport">
        <div class="cabin-world" id="cabin-world">
          <div class="cabin-face cabin-face-stern">
            <img
              src="images/cabin-stern-wall.jpg?v=5"
              alt="Stern wall with three sunrise ocean windows"
              draggable="false"
            />
          </div>
          <div class="cabin-face cabin-face-back">
            <img
              src="images/cabin-back-wall-v7.jpg?v=1"
              alt="Back wall with arched door and ship-view portholes"
              draggable="false"
            />
            <button type="button" class="cabin-door-exit" data-href="index.html">
              Exit to cruise hub
            </button>
          </div>
          <div class="cabin-face cabin-face-port">
            <img
              src="images/cabin-port-wall-v14.jpg?v=3"
              alt="Port wall with the left stern window and frame on the left"
              draggable="false"
            />
          </div>
          <div class="cabin-face cabin-face-starboard">
            <img
              src="images/cabin-starboard-wall-v5.jpg?v=3"
              alt="Starboard wall with the right stern window and frame on the right"
              draggable="false"
            />
          </div>
          <div class="cabin-face cabin-face-floor" aria-hidden="true"></div>
          <div class="cabin-face cabin-face-ceiling" aria-hidden="true"></div>
          <div
            class="cabin-prop cabin-prop-desk"
            id="cabin-desk"
            aria-hidden="true"
          >
            <img
              src="images/cabin-captain-desk.png?v=7"
              alt=""
              draggable="false"
            />
          </div>
          <div
            class="cabin-prop cabin-prop-rum"
            id="cabin-rum"
            aria-hidden="true"
          >
            <img
              src="images/cabin-rum-bottle.png?v=1"
              alt=""
              draggable="false"
            />
          </div>
          <div class="cabin-prop cabin-prop-chair" aria-hidden="true">
            <img
              src="images/cabin-captain-chair.png?v=3"
              alt=""
              draggable="false"
            />
          </div>
        </div>
      </div>
    </main>

    <div class="cabin-turn" role="group" aria-label="Rotate view">
      <button
        type="button"
        class="cabin-turn-btn"
        id="cabin-turn-left"
        aria-label="Rotate left"
      >
        ‹
      </button>
      <button
        type="button"
        class="cabin-turn-btn"
        id="cabin-turn-right"
        aria-label="Rotate right"
      >
        ›
      </button>
    </div>

    <div class="cabin-calibrate" id="cabin-calibrate" hidden>
      <div class="cabin-calibrate-header">
        <p class="cabin-calibrate-title" id="cabin-calibrate-title">Move desk</p>
        <button type="button" id="cabin-calibrate-close" class="cabin-calibrate-close">
          Close
        </button>
      </div>
      <p class="cabin-calibrate-help" id="cabin-calibrate-help">
        Drag to slide. Hold Alt and drag to tilt.
      </p>
      <div class="cabin-calibrate-targets" role="group" aria-label="Prop to move">
        <button type="button" data-target="desk" class="is-active">Desk</button>
        <button type="button" data-target="rum">Rum</button>
      </div>
      <div class="cabin-calibrate-pad" aria-label="Move">
        <button type="button" data-nudge="y,-1" title="Up">↑</button>
        <button type="button" data-nudge="x,-1" title="Left">←</button>
        <button type="button" data-nudge="x,1" title="Right">→</button>
        <button type="button" data-nudge="y,1" title="Down">↓</button>
      </div>
      <div class="cabin-calibrate-pad" aria-label="Depth and tilt">
        <button type="button" data-nudge="z,1" title="Toward room">In</button>
        <button type="button" data-nudge="z,-1" title="Toward wall">Out</button>
        <button type="button" data-nudge="rx,-1" title="Tilt back">Tilt −</button>
        <button type="button" data-nudge="rx,1" title="Tilt forward">Tilt +</button>
      </div>
      <div class="cabin-calibrate-pad" aria-label="Scale">
        <button type="button" data-nudge="scale,-1" title="Smaller">− Size</button>
        <button type="button" data-nudge="scale,1" title="Bigger">+ Size</button>
        <button type="button" data-nudge="rz,-1" title="Twist left">↺</button>
        <button type="button" data-nudge="rz,1" title="Twist right">↻</button>
      </div>
      <p class="cabin-calibrate-coords" id="cabin-calibrate-coords">—</p>
      <p class="cabin-calibrate-fine">
        Hold Shift for fine steps. Arrow keys move · [ ] depth · , . tilt
      </p>
      <button type="button" class="cabin-calibrate-copy" id="cabin-calibrate-copy">
        Copy pose values
      </button>
    </div>

    <script src="pirates-cabin.js?v=44"></script>
  </body>
</html>
