<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Captain’s Cabin · Regan N Elaina's Wedding Cruise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Pirata+One&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="pirate-treasures.css?v=45" />
  </head>
  <body class="pirate-page cabin-page">
    <header class="cabin-hud">
      <div class="cabin-brand">
        <p class="cabin-brand-mark">Captain’s Cabin</p>
        <p class="cabin-brand-line">Regan &amp; Elaina · Treasure awaits</p>
      </div>
      <div class="cabin-hud-actions">
        <a class="cabin-play" href="walk-the-plank.html">Walk the Plank</a>
        <a class="cabin-exit" href="index.html">Exit to cruise hub</a>
      </div>
    </header>

    <main class="cabin-stage" aria-label="Captain’s cabin wall">
      <div class="cabin-wall-view">
        <img
          id="cabin-wall-image"
          src="images/cabin-back-wall-v5.jpg?v=1"
          alt="Back wall with a centered arched wooden door at the bottom"
          draggable="false"
        />
      </div>
    </main>

    <div class="cabin-wall-switch" role="group" aria-label="Choose cabin wall to review">
      <button type="button" class="cabin-wall-btn" data-wall="stern">Stern</button>
      <button type="button" class="cabin-wall-btn" data-wall="port">Port</button>
      <button type="button" class="cabin-wall-btn" data-wall="starboard">Starboard</button>
      <button type="button" class="cabin-wall-btn is-active" data-wall="back">Back</button>
    </div>

    <p class="cabin-note" id="cabin-note">Back wall · arched door at the bottom</p>

    <script src="pirates-cabin.js?v=26"></script>
  </body>
</html>
